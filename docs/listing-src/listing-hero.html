<!doctype html><html><head><style>
* { margin: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; position: relative;
  background: #fafafa;
  background-image:
    radial-gradient(640px 340px at 50% -8%, rgba(220,38,38,0.10), transparent),
    radial-gradient(520px 300px at 96% 105%, rgba(37,99,235,0.10), transparent);
  font-family: -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; align-items: center; padding-top: 54px; }
.brand { display: flex; align-items: center; gap: 16px; }
.logo { width: 52px; height: 52px; border-radius: 12px; background: #dc2626;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 18px rgba(220,38,38,0.35); }
h1 { color: #18181b; font-size: 54px; letter-spacing: -1px; font-weight: 800; }
.tag { color: #52525b; font-size: 23px; margin-top: 14px; margin-bottom: 42px;
  text-align: center; max-width: 860px; line-height: 1.4; }
.tag b { color: #18181b; font-weight: 600; }
.wrap { position: relative; }
.shot { width: 960px; border-radius: 14px; overflow: hidden; background: #fff;
  padding: 30px;
  box-shadow: 0 24px 60px rgba(24,24,27,0.16), 0 0 0 1px rgba(24,24,27,0.07); }
.shot img { width: 100%; display: block; border-radius: 8px; }
.badge { position: absolute; top: -44px; right: -90px; width: 300px;
  display: flex; gap: 12px; align-items: flex-start;
  background: #fff; border-radius: 12px; padding: 16px;
  box-shadow: 0 20px 45px rgba(24,24,27,0.24), 0 0 0 1px rgba(24,24,27,0.08); }
.badge .icon { flex: none; width: 24px; height: 24px; color: #16a34a; }
.badge .t-title { color: #09090b; font-size: 14.5px; font-weight: 600; line-height: 1.45; }
.badge .t-body { color: #71717a; font-size: 13px; line-height: 1.45; margin-top: 3px; }
.badge .txt { min-width: 0; }
</style></head><body>
<div class="brand">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
  <h1>Croatia Toolkit</h1>
</div>
<p class="tag">OIB validation &amp; Sudski registar company lookup for Laravel —<br><b>type an OIB, get the verified company name and address back.</b></p>
<div class="wrap">
  <div class="shot"><img src="form-card.png"></div>
  <div class="badge">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <div class="txt">
      <div class="t-title">Verified via Sudski registar</div>
      <div class="t-body">Live company lookup — name &amp; address filled automatically.</div>
    </div>
  </div>
</div>
</body></html>
